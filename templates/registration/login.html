{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<section class="card auth-card">
    <h1>School Management Login</h1>
    <form method="post" class="styled-form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Sign In</button>
    </form>
</section>
{% endblock %}
